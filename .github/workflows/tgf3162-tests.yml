name: TGF3162 Controller tests

on:
  push:
    paths:
      - 'TTI-wavefunction-generator-controller/**'
      - '.github/workflows/tgf3162-tests.yml'
  pull_request:
    paths:
      - 'TTI-wavefunction-generator-controller/**'
      - '.github/workflows/tgf3162-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: TTI-wavefunction-generator-controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgf3162-controller"
version = "0.1.0"
description = "Local FastAPI and browser controller for the Aim-TTi TGF3162"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["tgf_controller*"]

[tool.setuptools.package-data]
tgf_controller = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
